# Paths that each role can change during a spec run. boundary.sh check reads this file.
#
# Format: <role> <pattern>. {spec} is replaced by the spec id.
# Patterns are shell globs. '*' also matches '/', so 'tests/*' allows all files under tests/.
# A role with no line can change nothing (test-auditor, reviewer).
#
# Not in any agent line, so protected from all agents: specs/, CLAUDE.md, .claude/, docs/architecture.md,
# docs/csharp-style.md, docs/workflow.md, scripts/, .github/, Directory.Build.props, .editorconfig, .gitattributes,
# .gitignore, runs/.

planner       plans/{spec}.md

test-writer   tests/*

implementer   src/*
implementer   AgenticPayments.slnx

documenter    README.md
documenter    docs/user/*

# The orchestrator role is checked once for the whole run, from the branch start to the final commit.
# It covers the agent paths, the plan decisions and the run evidence. It does not cover the controls.
orchestrator  plans/{spec}.md
orchestrator  runs/*
orchestrator  tests/*
orchestrator  src/*
orchestrator  AgenticPayments.slnx
orchestrator  README.md
orchestrator  docs/user/*
